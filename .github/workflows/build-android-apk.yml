name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Android versionCode (must increase for upgrades)
        required: true
        default: "436"
        type: string

permissions:
  contents: read

concurrency:
  group: build-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build mobile renderer
        run: |
          pnpm exec cross-env CHATBOX_BUILD_TARGET=mobile_app CHATBOX_BUILD_PLATFORM=android electron-vite build
          find release/app/dist -type f -name '*.map' -delete

      - name: Create Capacitor Android project
        shell: bash
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "xyz.chatboxapp.chatbox",
            "appName": "Chatbox",
            "webDir": "release/app/dist/renderer",
            "server": {
              "cleartext": true,
              "androidScheme": "http"
            },
            "ios": {
              "scheme": "Chatbox AI"
            },
            "plugins": {
              "CapacitorSQLite": {
                "iosDatabaseLocation": "Library/CapacitorDatabase",
                "iosIsEncryption": true,
                "iosKeychainPrefix": "angular-sqlite-app-starter",
                "iosBiometric": {
                  "biometricAuth": false,
                  "biometricTitle": "Biometric login for capacitor sqlite"
                },
                "androidIsEncryption": false,
                "androidBiometric": {
                  "biometricAuth": false,
                  "biometricTitle": "Biometric login for capacitor sqlite",
                  "biometricSubTitle": "Log in using your biometric"
                },
                "electronIsEncryption": true,
                "electronWindowsLocation": "C:\\ProgramData\\CapacitorDatabases",
                "electronMacLocation": "/Volumes/Development_Lacie/Development/Databases",
                "electronLinuxLocation": "Databases"
              },
              "SplashScreen": {
                "launchAutoHide": false,
                "androidSplashResourceName": "splash",
                "androidScaleType": "FIT_CENTER",
                "showSpinner": false,
                "splashFullScreen": true,
                "splashImmersive": true,
                "layoutName": "launch_screen",
                "useDialog": true
              }
            }
          }
          EOF
          pnpm exec cap add android
          pnpm exec cap sync android
          pnpm exec capacitor-assets generate --android

      - name: Configure signed release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/chatbox-release.p12"
          VERSION_NAME="$(node -p "require('./release/app/package.json').version")"
          python .github/scripts/configure_android_release.py \
            --android-dir android \
            --version-name "$VERSION_NAME" \
            --version-code "$ANDROID_VERSION_CODE"

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/chatbox-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatbox-android-release-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
